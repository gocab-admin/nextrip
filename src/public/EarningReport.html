<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earning Report</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 8px;
      text-align: left;
      border: 1px solid #ddd;
    }
    th {
      background-color: #f2f2f2;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>
  <h1>Earning Report</h1>
  <table>
    <thead>
      <tr>
        <th>Booking No</th>
        <th>Updated At</th>
        <th>Property Name</th>
        <th>Property Category</th>
        <th>Provider Name</th>
        <th>User Name</th>
        <th>Fare Amount</th>
        <th>Host Amount</th>
        <th>Tax</th>
        <th>Commission</th>
        <th>Admin Earned</th>
        <th>Refund Amount</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <!-- Booking rows will be inserted here dynamically -->
    </tbody>
  </table>
</body>
</html>
